[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox_mame_game_abstraction"
version = "0.1.0"
description = "Clean-room black-box game abstraction scaffold."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/mame-harness/tests"]

[tool.setuptools]
py-modules = []
