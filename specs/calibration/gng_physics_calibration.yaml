calibration_note: >
  Values derived from human-validated candidates across three calibration runs:
  jump_velocity_y and gravity_units_per_frame from 2 jump candidates (IDs 2, 3)
  in run_t10_7_jumps (T10.7.A). locomotion_velocity_x from 4 walk candidates
  (IDs 3, 5, 8, 10) in run_t10_7_walk (T10.7.C). projectile_velocity_x from 5
  projectile trajectory candidates (IDs 1, 2, 3, 4, 5) in run_t10_7_proj2
  (T10.7.E). Each candidate was visually confirmed by the operator against
  private PNG frames. Jump kinematic: v0 = 2H/t_asc, g = 2H/t_asc^2;
  t_peak_predicted = t_peak_observed = 4 frames (0% error). Projectile value is
  median of per-frame |Δx| across all accepted trajectory points; replaces
  pre-ADR-020 player_velocity_at_fire surrogate.
